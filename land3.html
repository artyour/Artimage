<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma Landing</title>
<style>
  * { box-sizing: border-box }
  html,body { height:100% }
  body {
    margin:0;
    font-family: system-ui, Segoe UI, Roboto, Arial;
    background:#0b0b0b;
    color:#fff;
  }

  .bg {
    position:fixed; inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.85)),
               center/cover no-repeat url("assets/bg.webp");
    z-index:-1;
  }

  .wrap {
    min-height:100%;
    display:grid;
    place-items:center;
    padding:16px;
  }

  .card {
    width:min(100%,1080px);
    display:grid;
    gap:16px;
    background:rgba(20,20,20,.6);
    backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    padding:20px;
    margin-bottom:40px;
  }

  h1 {
    margin:.2rem 0;
    font-size:clamp(1.6rem,2.6vw,2.6rem);
  }

  .tagline { font-style: italic; opacity:.85; margin:0 0 .5rem 0 }
  .lead { opacity:.95; line-height:1.6 }

  .media-box {
    width:min(100%,720px);
    margin:0 auto;
    border-radius:12px;
    overflow:hidden;
    background:#000;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }

  .media-box img, .media-box video {
    width:100%; height:auto; display:block; object-fit:cover;
  }

  .cta {
    display:flex;
    gap:.75rem;
    flex-wrap:wrap;
    margin-top:1rem;
  }

  /* 🔥 Nouveau style de boutons */
  .btn {
    position: relative;
    display: inline-block;
    padding: 0.9rem 1.4rem;
    border-radius: 999px;
    font-weight: 700;
    text-decoration: none;
    color: #fff;
    background: linear-gradient(90deg, #ff6ec4, #7873f5);
    overflow: hidden;
    transition: all 0.3s ease;
    box-shadow: 0 0 15px rgba(255, 110, 196, 0.6),
                0 0 25px rgba(120, 115, 245, 0.5);
  }

  .btn:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 0 20px rgba(255, 110, 196, 0.9),
                0 0 35px rgba(120, 115, 245, 0.8);
  }

  /* Variante ALT */
  .btn.alt {
    background: transparent;
    border: 2px solid transparent;
    background-image: linear-gradient(#0b0b0b, #0b0b0b),
                      linear-gradient(90deg, #ff6ec4, #7873f5);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    color: #fff;
    box-shadow: none;
  }

  .btn.alt:hover {
    color: #fff;
    background-image: linear-gradient(90deg, #ff6ec4, #7873f5),
                      linear-gradient(90deg, #ff6ec4, #7873f5);
  }

  @media (min-width:900px) {
    .card { grid-template-columns:1.1fr .9fr; align-items:center }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <main class="wrap">

    <!-- SECTION IMAGE -->
    <section class="card" id="image-free">
      <header class="head">
        <h1>Art Your Image</h1>
        <p class="tagline">Turn your memories into magic art.</p>
        <p class="lead">
          Transform your image with our <strong>free artistic curl effect</strong>.
        </p>
        <div class="cta">
          <a class="btn" href="#image-free-form">Art Your Image — Free</a>
        </div>
      </header>

      <div class="media-box">
        <img src="assets/curl.jpg" alt="Curl effect preview">
      </div>
    </section>

    <!-- SECTION VIDEO -->
    <section class="card" id="video-pro">
      <header class="head">
        <h1>Art Your Video</h1>
        <p class="tagline">Bring your story to life.</p>
        <p class="lead">
          Elevate your moment with a <strong>premium animated video</strong>.
        </p>
        <div class="cta">
          <a class="btn alt" href="#video-pro-order">Art Your Video — Premium</a>
        </div>
      </header>

      <div class="media-box">
        <video autoplay muted loop playsinline
               poster="assets/preview.jpg">
          <source src="assets/demo.webm" type="video/webm">
          <source src="assets/demo.mp4" type="video/mp4">
          Your browser does not support HTML5 video.
          <img src="assets/preview.jpg" alt="Video preview">
        </video>
      </div>
    </section>

  </main>
  <noscript>Enable JavaScript for the best experience.</noscript>
</body>
</html>
